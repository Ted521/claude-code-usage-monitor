services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: claude-usage-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # 브라우저 Origin = 웹 포트 → WEB_PORT 바꾸면 CORS도 같이 맞춤 (직접 CORS_ORIGINS 지정 시 그게 우선)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-5000},http://127.0.0.1:${WEB_PORT:-5000}}
      HISTORY_TTL_SEC: ${HISTORY_TTL_SEC:-60}
      REALTIME_TTL_SEC: ${REALTIME_TTL_SEC:-60}
    volumes:
      # ccusage가 읽는 Claude 로그·설정 — .env 의 CLAUDE_DATA_DIR (호스트 절대 경로)
      - ${CLAUDE_DATA_DIR}:/root/.claude:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: claude-usage-web
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      # 브라우저가 호출할 API 주소 (호스트 기준) — API_PORT 변경 시 함께 반영
      API_BASE_URL: ${API_BASE_URL:-http://localhost:${API_PORT:-8000}}
      HISTORY_TTL_SEC: ${HISTORY_TTL_SEC:-60}
      REALTIME_TTL_SEC: ${REALTIME_TTL_SEC:-60}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
