<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Code Usage</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
  <header class="header">
    <h1>Claude Code Usage</h1>
  </header>

  <nav class="tab-bar" role="tablist">
    <button type="button" class="tab active" data-view="history" role="tab">History &amp; Charts</button>
    <button type="button" class="tab" data-view="realtime" role="tab">Realtime (Today)</button>
  </nav>

  <div id="toast" class="toast hidden" aria-live="polite"></div>
  <div id="banner" class="banner hidden"></div>

  <section id="view-history" class="view active">
    <aside class="sidebar">
      <h2>Settings</h2>
      <label class="check"><input type="checkbox" id="use-since" checked /> Start date</label>
      <input type="date" id="since-date" />
      <label class="check"><input type="checkbox" id="use-until" /> End date</label>
      <input type="date" id="until-date" disabled />
      <button type="button" class="btn primary" id="btn-history-refresh">Refresh now</button>
    </aside>
    <main class="content">
      <p id="history-meta" class="meta">—</p>
      <div id="history-metrics" class="metrics"></div>
      <div class="sub-tabs">
        <button type="button" class="sub-tab active" data-sub="trend">Trend</button>
        <button type="button" class="sub-tab" data-sub="table">Daily table</button>
        <button type="button" class="sub-tab" data-sub="models">By model</button>
      </div>
      <div id="history-sub-trend" class="sub-panel active">
        <h3>Cost &middot; Tokens</h3>
        <div id="chart-cost-tokens" class="chart"></div>
        <h3>Input / Output</h3>
        <div id="chart-io" class="chart"></div>
      </div>
      <div id="history-sub-table" class="sub-panel">
        <div class="table-wrap" id="history-table"></div>
      </div>
      <div id="history-sub-models" class="sub-panel">
        <div class="table-wrap" id="models-detail-table"></div>
        <h3>Cumulative cost by model</h3>
        <div id="chart-model-cost" class="chart"></div>
      </div>
    </main>
  </section>

  <section id="view-realtime" class="view">
    <aside class="sidebar">
      <h2>Realtime</h2>
      <button type="button" class="btn primary" id="btn-realtime-refresh">Refresh now</button>
    </aside>
    <main class="content">
      <h2 id="rt-title">Today</h2>
      <p id="realtime-meta" class="meta">—</p>
      <div id="realtime-metrics" class="metrics"></div>
      <div id="active-block" class="card hidden"></div>
      <h3>Today usage trend</h3>
      <p class="meta">Minute snapshots are aggregated by hour or 5-minute buckets. First data appears after about one minute.</p>
      <div class="chart-controls">
        <label for="rt-timeline-granularity">Interval</label>
        <select id="rt-timeline-granularity">
          <option value="hour" selected>Hourly (today)</option>
          <option value="recent_5m">Last 2 hours &middot; 5 min</option>
        </select>
        <label for="rt-timeline-mode">Display</label>
        <select id="rt-timeline-mode">
          <option value="incremental" selected>Incremental</option>
          <option value="cumulative">Cumulative</option>
        </select>
      </div>
      <p id="rt-timeline-status" class="meta">—</p>
      <div id="chart-rt-timeline" class="chart"></div>
      <h3>By model (today) &middot; Tokens</h3>
      <div id="chart-rt-model-tokens" class="chart"></div>
      <div class="table-wrap" id="rt-model-table"></div>
      <details class="collapsible">
        <summary>By session (today)</summary>
        <div class="table-wrap" id="session-table"></div>
      </details>
    </main>
  </section>

  <script>
    window.APP_CONFIG = {
      apiBaseUrl: {{ api_base_url | tojson }},
      realtimeTtlDefault: {{ realtime_ttl_default }},
      pollMs: 2000,
      realtimeIntervalMs: 60000,
    };
  </script>
  <script src="{{ url_for('static', filename='app.js') }}?v=12"></script>
</body>
</html>
